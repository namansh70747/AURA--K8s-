apiVersion: v1
kind: Pod
metadata:
  name: test-pod-1-cpu-stress
  namespace: default
  labels:
    app: test-pod-1
    test-type: cpu-stress
spec:
  containers:
  - name: cpu-stress
    image: polinux/stress:latest
    resources:
      requests:
        cpu: "200m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"
    command: ["stress"]
    args: ["--cpu", "1", "--timeout", "600s"]
  - name: memory-stress
    image: polinux/stress:latest
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "200m"
        memory: "256Mi"
    command: ["stress"]
    args: ["--vm", "1", "--vm-bytes", "100M", "--timeout", "600s"]
---
apiVersion: v1
kind: Pod
metadata:
  name: test-pod-2-memory-leak
  namespace: default
  labels:
    app: test-pod-2
    test-type: memory-leak
spec:
  containers:
  - name: memory-leak
    image: polinux/stress:latest
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "300m"
        memory: "1Gi"
    command: ["stress"]
    args: ["--vm", "2", "--vm-bytes", "200M", "--timeout", "600s"]
---
apiVersion: v1
kind: Pod
metadata:
  name: test-pod-3-mixed
  namespace: default
  labels:
    app: test-pod-3
    test-type: mixed
spec:
  containers:
  - name: cpu-worker
    image: polinux/stress:latest
    resources:
      requests:
        cpu: "150m"
        memory: "200Mi"
      limits:
        cpu: "400m"
        memory: "400Mi"
    command: ["stress"]
    args: ["--cpu", "1", "--timeout", "600s"]
  - name: io-worker
    image: polinux/stress:latest
    resources:
      requests:
        cpu: "50m"
        memory: "64Mi"
      limits:
        cpu: "100m"
        memory: "128Mi"
    command: ["stress"]
    args: ["--io", "1", "--timeout", "600s"]

