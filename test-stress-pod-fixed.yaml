apiVersion: v1
kind: Pod
metadata:
  name: stress-test-pod-fixed
  namespace: default
  labels:
    app: stress-test
spec:
  containers:
  - name: stress
    image: polinux/stress:latest
    command: ["stress"]
    args: ["--cpu", "2", "--vm", "1", "--vm-bytes", "300M", "--timeout", "300s"]
    resources:
      requests:
        cpu: "100m"
        memory: "128Mi"
      limits:
        cpu: "500m"
        memory: "512Mi"

